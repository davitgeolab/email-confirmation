<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmed</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .box {
      padding: 40px;
    }

    .check {
      width: 100px;
      height: 100px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #22c55e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 60px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="check">✓</div>

    <h1>Email Confirmed</h1>

    <p>Your email address has been successfully confirmed.</p>
  </div>

</body>
</html>
