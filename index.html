<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continue in Wallpaper</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .box {
      padding: 40px;
      max-width: 600px;
    }

    .check {
      width: 100px;
      height: 100px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #22c55e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 60px;
    }

    h1 {
      margin-bottom: 15px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="check">✓</div>

    <h1>Continue in the Wallpaper app</h1>

    <p>
      Open this link on your iPhone to continue.
      <br><br>
      This link can only be used once.
      <br>
      If you opened it on another device, please request a new link
      and open the new one on your iPhone.
    </p>
  </div>

</body>
</html>
